<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Kaki multi-agent architecture">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa9ba"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#128a7c"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6f8a"/></marker>
  </defs>
  <style>
    .t{font:700 20px Helvetica,Arial,sans-serif;fill:#fff}
    .d{font:16.5px Helvetica,Arial,sans-serif;fill:#fff}
    .band{font:700 17px Helvetica,Arial,sans-serif;fill:#14263d}
    .bands{font:15px Helvetica,Arial,sans-serif;fill:#5f6b7a}
    .mt{font:700 17.5px Helvetica,Arial,sans-serif;fill:#14263d}
    .ag{font:italic 600 15px Helvetica,Arial,sans-serif;fill:#128a7c}
    .ml{font:15px Helvetica,Arial,sans-serif;fill:#1e293b}
    .lk{font:600 14.5px Helvetica,Arial,sans-serif;fill:#128a7c}
    .lm{font:600 14.5px Helvetica,Arial,sans-serif;fill:#5b6f8a}
  </style>
  <rect x="20" y="14" width="1160" height="66" rx="16" fill="#14263d"/>
  <text x="44" y="42" class="t">EXPERIENCE</text>
  <text x="44" y="67" class="d">Assistant chat · Today plan · Live and uploaded meetings · Recruiting board · Company map</text>

  <rect x="20" y="98" width="1160" height="66" rx="16" fill="#203a5f"/>
  <text x="44" y="126" class="t">API, IDENTITY AND SENSITIVE-DATA GATE</text>
  <text x="44" y="151" class="d">Fastify · signed sessions · pattern rules, then a classifier model, before any agent sees a message</text>

  <!-- agent layer container -->
  <rect x="20" y="182" width="1160" height="458" rx="18" fill="#f3faf8" stroke="#18a999" stroke-width="2"/>
  <text x="44" y="210" class="band">MULTI-AGENT LAYER</text>
  <text x="232" y="210" class="bands">shared models: Claude Sonnet 4.5 in deployment · Qwen 3.8 27B in development</text>

  <g stroke="#18a999" stroke-width="2.5" fill="#ffffff">
    <rect x="40" y="226" width="340" height="176" rx="14"/>
    <rect x="430" y="226" width="340" height="176" rx="14"/>
    <rect x="820" y="226" width="340" height="176" rx="14"/>
  </g>
  <text x="58" y="254" class="mt">S1 · COMPANY CONTEXT AGENT</text>
  <text x="58" y="278" class="ag">Plans searches, writes cited answers</text>
  <text x="58" y="306" class="ml">Bounded tool loop, typed tools</text>
  <text x="58" y="330" class="ml">Hybrid search + link-following</text>
  <text x="58" y="354" class="ml">Answers as of any past day</text>
  <text x="58" y="378" class="ml">Detects knowledge gaps</text>

  <text x="448" y="254" class="mt">S2 · MEETING ACTIONS AGENT</text>
  <text x="448" y="278" class="ag">Listens, extracts, drafts follow-ups</text>
  <text x="448" y="306" class="ml">Live transcription</text>
  <text x="448" y="330" class="ml">Commitments and decisions</text>
  <text x="448" y="354" class="ml">Answers questions in the meeting</text>
  <text x="448" y="378" class="ml">Flags conflicts with past decisions</text>

  <text x="838" y="254" class="mt">S3 · RECRUITING AGENT</text>
  <text x="838" y="278" class="ag">Proposes criteria, judges fit, drafts</text>
  <text x="838" y="306" class="ml">Founder confirms criteria first</text>
  <text x="838" y="330" class="ml">Public-profile search (Exa)</text>
  <text x="838" y="354" class="ml">Fit reasons per criterion</text>
  <text x="838" y="378" class="ml">Outreach drafts</text>

  <!-- S2 -> S3 hiring request -->
  <line x1="772" y1="300" x2="814" y2="300" stroke="#128a7c" stroke-width="3" marker-end="url(#a3)"/>
  <text x="793" y="292" class="lk" text-anchor="middle" style="font-size:12.5px">hiring</text>

  <!-- S1 -> S3 lane -->
  <path d="M 140 404 L 140 426 L 1060 426 L 1060 408" fill="none" stroke="#128a7c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a3)"/>
  <rect x="445" y="415" width="310" height="22" fill="#f3faf8"/>
  <text x="600" y="431" class="lk" text-anchor="middle">knowledge gap in S1 opens a role in S3</text>

  <!-- supporting agents row -->
  <g stroke-width="2.5">
    <rect x="40" y="456" width="340" height="166" rx="14" fill="#ffffff" stroke="#9aa9ba"/>
    <rect x="430" y="456" width="340" height="166" rx="14" fill="#eef2f7" stroke="#5b6f8a"/>
    <rect x="820" y="456" width="340" height="166" rx="14" fill="#ffffff" stroke="#9aa9ba"/>
  </g>
  <text x="58" y="484" class="mt">SPECIALIST MODELS</text>
  <text x="58" y="510" class="ml" style="font-weight:700">Jev decision model (TypeSafe)</text>
  <text x="58" y="532" class="ml">Calibrated yes/no on meeting conflicts</text>
  <text x="58" y="554" class="ml">and times, with model fallback</text>
  <text x="58" y="584" class="ml">Sensitive-data classifier</text>
  <text x="58" y="608" class="ml">Emergent-graph extraction (Cognee)</text>

  <text x="448" y="484" class="mt">MEMORY AGENT (LETTA)</text>
  <text x="448" y="508" class="ag" style="fill:#5b6f8a">One per employee, edits its own memory</text>
  <text x="448" y="536" class="ml">Learns working context after each turn</text>
  <text x="448" y="560" class="ml">Keeps the founder's hiring intent</text>
  <text x="448" y="584" class="ml">Never cited as company evidence</text>

  <text x="838" y="484" class="mt">CODE, NOT MODELS, DECIDES</text>
  <text x="838" y="512" class="ml">Citation gate on every answer</text>
  <text x="838" y="536" class="ml">Dates, risk tiers, candidate tiers</text>
  <text x="838" y="560" class="ml">Tool-output budget</text>
  <text x="838" y="584" class="ml">Every model reply validated</text>

  <!-- memory links -->
  <line x1="386" y1="392" x2="426" y2="470" stroke="#5b6f8a" stroke-width="2.5" marker-start="url(#a4)" marker-end="url(#a4)"/>
  <line x1="814" y1="392" x2="774" y2="470" stroke="#5b6f8a" stroke-width="2.5" marker-end="url(#a4)"/>

  <rect x="20" y="660" width="560" height="140" rx="16" fill="#427aa1"/>
  <text x="44" y="690" class="t">COMPANY EVIDENCE (citable)</text>
  <text x="44" y="718" class="d">PostgreSQL full-text + pgvector (Titan V2)</text>
  <text x="44" y="742" class="d">Document links · deterministic graph</text>
  <text x="44" y="766" class="d">Emergent graph per question</text>
  <text x="44" y="790" class="d">Planner projection (shown, never cited)</text>

  <rect x="620" y="660" width="560" height="140" rx="16" fill="#5b6f8a"/>
  <text x="644" y="690" class="t">PERSONAL CONTEXT (never cited)</text>
  <text x="644" y="718" class="d">Letta memory files, one set per employee</text>
  <text x="644" y="742" class="d">Conversation history (last six turns)</text>
  <text x="644" y="766" class="d">Isolated between employees</text>

  <rect x="20" y="818" width="1160" height="70" rx="16" fill="#f26b4e"/>
  <text x="44" y="848" class="t">ACTION CONTROL</text>
  <text x="44" y="874" class="d">Auto · approval · escalate · blocked, set by code · approval bound to payload hash · zero-credential handoff</text>

  <line x1="600" y1="81" x2="600" y2="94" stroke="#9aa9ba" stroke-width="4" marker-end="url(#a1)"/>
  <line x1="600" y1="165" x2="600" y2="178" stroke="#9aa9ba" stroke-width="4" marker-end="url(#a1)"/>
  <line x1="300" y1="641" x2="300" y2="656" stroke="#9aa9ba" stroke-width="4" marker-end="url(#a1)"/>
  <line x1="900" y1="641" x2="900" y2="656" stroke="#9aa9ba" stroke-width="4" marker-end="url(#a1)"/>
  <line x1="600" y1="801" x2="600" y2="814" stroke="#9aa9ba" stroke-width="4" marker-end="url(#a1)"/>
</svg>
