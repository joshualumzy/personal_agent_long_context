services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: orgforge
      POSTGRES_USER: orgforge
      POSTGRES_PASSWORD: orgforge-local
    ports:
      - "5432:5432"
    volumes:
      - orgforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgforge -d orgforge"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  orgforge-postgres:
