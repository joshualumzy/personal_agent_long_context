<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiring Orbit</title>
  <link rel="stylesheet" href="/recruiting.css">
  <script src="/recruiting.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="title-block">
      <h1 id="role-title">Who do you need?</h1>
      <p id="status-line" class="status-line"></p>
    </div>
    <div class="top-actions" id="top-actions" hidden>
      <span id="clock" class="clock"></span>
      <button type="button" class="quiet" id="fast-forward" title="Simulate a week passing">Skip a week</button>
      <a class="quiet" id="gmail" href="/api/recruiting/gmail/connect">Connect Gmail</a>
      <button type="button" class="quiet warn" id="reset">Start over</button>
    </div>
  </header>

  <p id="error" class="banner error" role="alert" hidden></p>

  <!-- Step 1: describe the role -->
  <section id="intake" class="intake" hidden>
    <form id="intake-form">
      <label for="requirement" class="prompt">Describe the person the way you would to a friend.</label>
      <textarea id="requirement" rows="5" placeholder="I need a founding backend engineer in Singapore, strong in TypeScript and Node, who has shipped product at a startup. Rust would be a bonus."></textarea>
      <div class="intake-row">
        <label class="file-button">
          <input type="file" id="jd-file" accept=".txt,.md,.pdf,.docx">
          <span>Upload a job description instead</span>
        </label>
        <button type="submit" class="primary">Draft criteria</button>
      </div>
    </form>
  </section>

  <!-- Step 2: confirm criteria once -->
  <section id="review" class="review" hidden>
    <p class="prompt">Here is how I would judge people. Change anything, then confirm.</p>
    <ul id="draft-criteria" class="draft-criteria"></ul>
    <button type="button" class="link" id="add-criterion">Add a criterion</button>
    <div id="refused" class="banner note" hidden></div>
    <div class="review-actions">
      <button type="button" class="primary" id="confirm">Confirm and search</button>
    </div>
  </section>

  <!-- Step 3: the orbit -->
  <main id="board" class="board" hidden>
    <section class="orbit-wrap" aria-label="Candidate orbit">
      <svg id="orbit" viewBox="-500 -500 1000 1000" role="img" aria-labelledby="orbit-title">
        <title id="orbit-title">Candidates arranged by match, strongest at the centre</title>
      </svg>
      <ul class="legend" aria-label="What the rings mean">
        <li><i class="swatch s100"></i>Centre meets everything</li>
        <li><i class="swatch s75"></i>Middle misses a nice-to-have</li>
        <li><i class="swatch s50"></i>Outer misses one must</li>
      </ul>
      <p id="sample-note" class="sample-note" hidden>These are fictional sample profiles, shown because no Exa key is set.</p>
    </section>

    <aside class="rail">
      <div id="proposals" class="proposals"></div>

      <section class="criteria-panel">
        <h2>Looking for</h2>
        <ul id="criteria" class="chips"></ul>
      </section>

      <div class="rail-foot">
        <p id="agent-reply" class="agent-reply" aria-live="polite"></p>
        <form id="say-form" class="composer">
          <label for="say" class="visually-hidden">Tell the agent</label>
          <textarea id="say" rows="1" placeholder="Tell the agent anything, or paste a LinkedIn link"></textarea>
          <button type="submit" class="send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <div class="hints" aria-label="Examples">
          <button type="button" class="hint">Remote is fine after all</button>
          <button type="button" class="hint">Pass on this one, too corporate</button>
          <button type="button" class="hint">Why do we need this criterion?</button>
        </div>
      </div>
    </aside>
  </main>

  <aside id="drawer" class="drawer" aria-label="Candidate details" hidden></aside>
</body>
</html>
