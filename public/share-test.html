<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share test</title>
  <link rel="stylesheet" href="/meetings/styles.css">
  <script src="/meetings/share-test.js" defer></script>
</head>
<body>
  <main class="share-test">
    <h1>共享声音测试</h1>
    <p>在两个标签页各打开本页，都点「开始共享」并选「整个屏幕」（打开系统音频开关）。然后放一段有声音的视频，看两边的音量条是不是都在动。</p>
    <p><button type="button" id="start" class="primary">开始共享</button>
       <button type="button" id="stop" class="quiet" disabled>停止</button></p>
    <p id="kind">未开始</p>
    <div class="share-meter">
      <div id="bar"></div>
    </div>
    <p id="verdict"></p>
  </main>
</body>
</html>
